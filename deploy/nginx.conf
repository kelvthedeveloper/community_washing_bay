server {
    listen 80;
    server_name washing-bay.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name washing-bay.example.com;

    ssl_certificate /etc/letsencrypt/live/washing-bay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/washing-bay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/community-washing-bay/frontend/dist;
    index index.html;
    client_max_body_size 11m;

    location /static/ {
        alias /srv/community-washing-bay/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://unix:/run/community-washing-bay/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
